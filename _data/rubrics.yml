basics:
  title: "DevOps база - back to the core"
  slug: "basic-things"
  description: "Час повернутись до витоків, до бази базової, і, так би мовити, згадати запах ґрунту DevOps-стежок."
  origin: "З'явилось це бажання не просто так. За останні пів року я провів понад 50 співбесід на позицію DevOps. Кандидати були різних рівнів і з різним бекграундом. Деякі CV, м'яко кажучи, викликали захват, досвід колег по DevOps-практиках і місця роботи були справді вражаючими. Але з цих 50+ лише один зміг нормально відповісти, що таке Load Average. Тому й вирішив нагадати серією публікацій основні речі і собі, і людям."
current-work:
  title: "Робочі кейси"
  slug: "current-work"
  description: "Рубрика про мою поточнуроботу: живі зміни в існуючих системах, операційні рішення, міграції, rollout-и, дебаг і вся та буденщина, з якої насправді і складається нормальна інженерна практика."
