<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #f8fafc;
      --card: #ffffff;
      --line: #d9e2ec;
      --line-strong: #c7d4e2;
      --ink: #1f2a37;
      --muted: #5f6c7b;
      --brand: #0ea5e9;
      --brand-soft: #e7f6fd;
      --code-bg: #f3f6fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f3f6fa 0%, #eaf0f6 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    .site-shell {
      max-width: 1120px;
      margin: 1.2rem auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(16, 24, 40, 0.05);
    }

    .site-head {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 1.1rem 1.2rem 1rem;
    }

    .brand {
      margin: 0;
      font-size: 2.35rem;
      line-height: 1;
      letter-spacing: 0.1px;
      font-weight: 700;
    }

    .brand a {
      text-decoration: none;
      color: var(--ink);
    }

    .subtitle {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .site-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #fff;
      border-bottom: 2px solid var(--brand);
    }

    .nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav a {
      text-decoration: none;
      color: #3b4958;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.25px;
      font-weight: 600;
    }

    .nav a:hover,
    .nav a.active {
      background: var(--brand-soft);
      color: #0b4f6c;
    }

    .content-shell { padding: 1rem; }

    .article-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
    }

    .article-card h1 { margin-top: 0; font-size: 2.05rem; line-height: 1.2; }
    .article-card h2 { font-size: 1.65rem; margin-top: 1.55rem; }
    .article-card h3 { font-size: 1.3rem; margin-top: 1.3rem; }

    .article-card code {
      background: var(--code-bg);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 0.08rem 0.3rem;
    }

    .article-card pre {
      overflow-x: auto;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--code-bg);
    }

    .article-card pre code {
      border: 0;
      background: transparent;
      padding: 0;
    }

    .article-card blockquote {
      margin-left: 0;
      padding: 0.35rem 0 0.35rem 0.8rem;
      border-left: 4px solid var(--line-strong);
      color: var(--muted);
    }

    .post-meta { color: var(--muted); margin-bottom: 1rem; }

    @media (max-width: 860px) {
      .brand { font-size: 1.9rem; }
      .subtitle { font-size: 0.94rem; }
      .article-card h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-head">
      <h1 class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <div class="site-top">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Головна</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>Про блог</a>
      </nav>
    </div>
    {{ content }}
  </div>
</body>
</html>
