basics:
  title: "Базові речі"
  slug: "basic-things"
  description: "Серія простих пояснень для тем, які майже всі ніби знають, але на практиці або на співбесідах дуже швидко починають плисти."
  origin: "Рубрика виростає з пів року співбесід і щоденної роботи. В якийсь момент стає дуже видно, що багато базових DevOps-тем люди пам'ятають на рівні термінів, але не завжди можуть спокійно пояснити, як це працює в реальній системі."
