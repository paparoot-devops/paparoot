<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <style>
    :root {
      --bg-a: #142033;
      --bg-b: #1f2e46;
      --surface: #1f2c3f;
      --card: #2b3a50;
      --line: #40516a;
      --line-strong: #596d8b;
      --ink: #e9f2ff;
      --muted: #b7c7de;
      --brand: #22d3ee;
      --brand-2: #f59e0b;
      --brand-3: #a78bfa;
      --brand-soft: #16374a;
      --code-bg: #243246;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 18%, rgba(245, 158, 11, 0.15) 0, transparent 25%),
        radial-gradient(circle at 88% 8%, rgba(34, 211, 238, 0.18) 0, transparent 28%),
        radial-gradient(circle at 70% 75%, rgba(167, 139, 250, 0.14) 0, transparent 22%),
        linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .bg-stickers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .sticker-img {
      position: absolute;
      width: 66px;
      height: 66px;
      object-fit: contain;
      opacity: 0.16;
      filter: saturate(1.05) contrast(1.02);
      animation: floaty 26s ease-in-out infinite;
    }

    .sticker-img.soft { opacity: 0.12; }
    .sticker-img.big { width: 86px; height: 86px; opacity: 0.14; }

    .sticker.s2 { animation-duration: 32s; }
    .sticker.s3 { animation-duration: 28s; }
    .sticker.s4 { animation-duration: 36s; }
    .sticker.s5 { animation-duration: 30s; }
    .sticker.s6 { animation-duration: 34s; }
    .sticker-img.s2 { animation-duration: 32s; }
    .sticker-img.s3 { animation-duration: 28s; }
    .sticker-img.s4 { animation-duration: 36s; }
    .sticker-img.s5 { animation-duration: 30s; }
    .sticker-img.s6 { animation-duration: 34s; }
    .sticker-img.s7 { animation-duration: 38s; }
    .sticker-img.s8 { animation-duration: 40s; }

    @keyframes floaty {
      0% { transform: translate3d(0, 0, 0) rotate(-2deg); }
      25% { transform: translate3d(10px, -8px, 0) rotate(1deg); }
      50% { transform: translate3d(-8px, 9px, 0) rotate(3deg); }
      75% { transform: translate3d(6px, -6px, 0) rotate(-1deg); }
      100% { transform: translate3d(0, 0, 0) rotate(-2deg); }
    }

    .site-shell {
      max-width: 1120px;
      margin: 1.2rem auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(8, 12, 20, 0.35);
      position: relative;
      z-index: 1;
    }

    .site-shell::before,
    .site-shell::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 20px;
      filter: blur(2px);
      pointer-events: none;
      opacity: 0.5;
    }

    .site-shell::before {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(167, 139, 250, 0.15));
      top: -38px;
      right: 32px;
      transform: rotate(12deg);
    }

    .site-shell::after {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(34, 211, 238, 0.1));
      bottom: -38px;
      left: 28px;
      transform: rotate(-16deg);
    }

    .site-head {
      background: #111a29;
      border-bottom: 1px solid var(--line);
      padding: 1.1rem 1.2rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .site-head::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(34, 211, 238, 0.08) 45%, transparent 100%);
      pointer-events: none;
    }

    .brand {
      margin: 0;
      font-size: 2.35rem;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.2px;
      position: relative;
      z-index: 1;
    }

    .brand a { text-decoration: none; color: #f8fbff; }

    .subtitle {
      margin: 0.45rem 0 0;
      color: #9fb4d1;
      font-size: 1rem;
      position: relative;
      z-index: 1;
    }

    .site-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: #182336;
      border-bottom: 2px solid var(--brand);
    }

    .nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav a {
      text-decoration: none;
      color: #c3d5ee;
      padding: 0.45rem 0.78rem;
      border-radius: 999px;
      font-size: 0.88rem;
      text-transform: none;
      letter-spacing: 0.15px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .nav a:hover,
    .nav a.active {
      background: var(--brand-soft);
      border-color: #2f556b;
      color: #8be9fd;
    }

    .content-shell { padding: 1rem; }

    .article-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .article-card h1 { margin-top: 0; font-size: 2.05rem; line-height: 1.2; color: #f3f7ff; }
    .article-card h2 { font-size: 1.65rem; margin-top: 1.55rem; color: #edf4ff; }
    .article-card h3 { font-size: 1.3rem; margin-top: 1.3rem; color: #edf4ff; }
    .article-card p, .article-card li { color: #d8e3f3; }

    .article-card code {
      background: #223043;
      border: 1px solid #3f526e;
      border-radius: 5px;
      padding: 0.08rem 0.3rem;
      color: #bff7ff;
      font-family: "IBM Plex Mono", "Consolas", monospace;
    }

    .article-card pre {
      overflow-x: auto;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--code-bg);
    }

    .article-card pre code {
      border: 0;
      background: transparent;
      color: #bde7ff;
      padding: 0;
    }

    .article-card blockquote {
      margin-left: 0;
      padding: 0.35rem 0 0.35rem 0.8rem;
      border-left: 4px solid var(--line-strong);
      color: var(--muted);
    }

    .post-meta { color: var(--muted); margin-bottom: 1rem; }

    @media (max-width: 860px) {
      .brand { font-size: 1.9rem; }
      .subtitle { font-size: 0.94rem; }
      .article-card h1 { font-size: 1.75rem; }
      .sticker-img { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-stickers" aria-hidden="true">
    <img class="sticker-img s1" style="top: 8%; left: 11%;" src="{{ '/assets/stickers/tools/kubernetes.svg' | relative_url }}" alt="">
    <img class="sticker-img s2" style="top: 20%; right: 12%;" src="{{ '/assets/stickers/tools/terraform.svg' | relative_url }}" alt="">
    <img class="sticker-img s3" style="top: 38%; left: 12%;" src="{{ '/assets/stickers/tools/prometheus.svg' | relative_url }}" alt="">
    <img class="sticker-img s4 soft" style="top: 58%; right: 14%;" src="{{ '/assets/stickers/tools/helm.svg' | relative_url }}" alt="">
    <img class="sticker-img s5" style="top: 78%; left: 12%;" src="{{ '/assets/stickers/tools/linux.svg' | relative_url }}" alt="">
    <img class="sticker-img s2 soft" style="top: 34%; right: 24%;" src="{{ '/assets/stickers/tools/github-actions.svg' | relative_url }}" alt="">
    <img class="sticker-img s6 big" style="top: 70%; right: 20%;" src="{{ '/assets/stickers/memes/beer.svg' | relative_url }}" alt="">
    <img class="sticker-img s7 soft" style="top: 40%; right: 30%;" src="{{ '/assets/stickers/memes/beer.svg' | relative_url }}" alt="">
    <img class="sticker-img s7 soft" style="top: 14%; right: 3%;" src="{{ '/assets/stickers/tools/docker.svg' | relative_url }}" alt="">
    <img class="sticker-img s8" style="top: 27%; left: 3%;" src="{{ '/assets/stickers/tools/ansible.svg' | relative_url }}" alt="">
    <img class="sticker-img s4 soft" style="top: 52%; left: 3%;" src="{{ '/assets/stickers/tools/grafana.svg' | relative_url }}" alt="">
    <img class="sticker-img s6 soft" style="top: 64%; right: 3%;" src="{{ '/assets/stickers/tools/argo.svg' | relative_url }}" alt="">
    <img class="sticker-img s7 soft" style="top: 82%; right: 4%;" src="{{ '/assets/stickers/tools/jenkins.svg' | relative_url }}" alt="">
    <img class="sticker-img s8 soft" style="top: 90%; left: 35%;" src="{{ '/assets/stickers/tools/gitlab.svg' | relative_url }}" alt="">
    <img class="sticker-img s5 soft" style="top: 6%; left: 36%;" src="{{ '/assets/stickers/tools/nginx.svg' | relative_url }}" alt="">
    <img class="sticker-img s4 soft" style="top: 30%; left: 20%;" src="{{ '/assets/stickers/tools/redis.svg' | relative_url }}" alt="">
    <img class="sticker-img s8 soft" style="top: 42%; right: 20%;" src="{{ '/assets/stickers/tools/postgresql.svg' | relative_url }}" alt="">
    <img class="sticker-img s7 soft" style="top: 50%; right: 10%;" src="{{ '/assets/stickers/tools/rabbitmq.svg' | relative_url }}" alt="">
    <img class="sticker-img s3 soft" style="top: 66%; left: 6%;" src="{{ '/assets/stickers/tools/elasticsearch.svg' | relative_url }}" alt="">
    <img class="sticker-img s2 soft" style="top: 18%; right: 18%;" src="{{ '/assets/stickers/tools/amazonwebservices-original-wordmark.svg' | relative_url }}" alt="">
    <img class="sticker-img s4 soft" style="top: 12%; right: 30%;" src="{{ '/assets/stickers/tools/amazonwebservices-plain-wordmark.svg' | relative_url }}" alt="">
    <img class="sticker-img s7 soft" style="top: 40%; right: 34%;" src="{{ '/assets/stickers/tools/amazonwebservices-line-wordmark.svg' | relative_url }}" alt="">
    <img class="sticker-img s6 soft" style="top: 88%; right: 18%;" src="{{ '/assets/stickers/tools/gcp.svg' | relative_url }}" alt="">

    <img class="sticker-img s5 soft" style="top: 24%; left: 31%;" src="{{ '/assets/stickers/tools/kafka.svg' | relative_url }}" alt="">
    <img class="sticker-img s7 soft" style="top: 32%; right: 31%;" src="{{ '/assets/stickers/tools/aws.svg' | relative_url }}" alt="">
    <img class="sticker-img s8 soft" style="top: 61%; left: 27%;" src="{{ '/assets/stickers/tools/opentelemetry.svg' | relative_url }}" alt="">
    <img class="sticker-img s5 soft" style="top: 73%; right: 7%;" src="{{ '/assets/stickers/tools/traefik.svg' | relative_url }}" alt="">
    <img class="sticker-img s3 soft" style="top: 92%; left: 46%;" src="{{ '/assets/stickers/tools/cloudflare.svg' | relative_url }}" alt="">
    <img class="sticker-img s8 soft" style="top: 48%; left: 30%;" src="{{ '/assets/stickers/tools/grafana-alt.svg' | relative_url }}" alt="">
  </div>
  <div class="site-shell">
    <header class="site-head">
      <h1 class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <div class="site-top">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Головна</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>Про блог</a>
      </nav>
    </div>
    {{ content }}
  </div>
</body>
</html>
