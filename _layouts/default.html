<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      --bg: #e5e7eb;
      --surface: #f8fafc;
      --card: #ffffff;
      --line: #d1d5db;
      --ink: #1f2937;
      --muted: #6b7280;
      --brand: #0ea5e9;
      --brand-dark: #0284c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    .site-shell {
      max-width: 1080px;
      margin: 1.5rem auto;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .site-head {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 1rem 1rem 0.9rem;
    }

    .brand {
      margin: 0;
      font-size: 3rem;
      line-height: 1;
      letter-spacing: 0.2px;
    }

    .brand a {
      text-decoration: none;
      color: var(--ink);
    }

    .subtitle {
      margin: 0.4rem 0 0;
      color: #374151;
      font-size: 1.05rem;
    }

    .site-top {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #fff;
      border-bottom: 3px solid var(--brand);
    }

    .nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav a {
      text-decoration: none;
      color: #374151;
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .nav a:hover,
    .nav a.active { background: var(--brand); color: #fff; }

    .content-shell { padding: 1rem; }

    .article-card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 1rem 1.2rem;
    }

    .article-card h1 { margin-top: 0; font-size: 2.2rem; line-height: 1.15; }
    .article-card h2 { font-size: 1.9rem; }
    .article-card h3 { font-size: 1.35rem; }

    .article-card pre {
      overflow-x: auto;
      padding: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #eef2ff;
    }

    .article-card blockquote {
      margin-left: 0;
      padding-left: 0.8rem;
      border-left: 4px solid var(--line);
      color: var(--muted);
    }

    .post-meta { color: var(--muted); margin-bottom: 1rem; }

    @media (max-width: 860px) {
      .brand { font-size: 2.1rem; }
      .subtitle { font-size: 0.95rem; }
      .article-card h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-head">
      <h1 class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <div class="site-top">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Головна</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>Про блог</a>
      </nav>
    </div>
    {{ content }}
  </div>
</body>
</html>
