<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <style>
    :root {
      --bg: #1f2733;
      --grid: rgba(148, 163, 184, 0.08);
      --surface: #2a3442;
      --card: #323d4d;
      --line: #435167;
      --line-strong: #54657f;
      --ink: #e5edf8;
      --muted: #b7c4d7;
      --brand: #22d3ee;
      --brand-soft: #0f2f3b;
      --code-bg: #2a3342;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    .site-shell {
      max-width: 1120px;
      margin: 1.2rem auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    }

    .site-head {
      background: #101722;
      border-bottom: 1px solid var(--line);
      padding: 1.1rem 1.2rem 1rem;
    }

    .brand {
      margin: 0;
      font-size: 2.35rem;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand a { text-decoration: none; color: #f8fbff; }

    .subtitle {
      margin: 0.45rem 0 0;
      color: #9fb0c8;
      font-size: 1rem;
    }

    .site-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #172130;
      border-bottom: 2px solid var(--brand);
    }

    .nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav a {
      text-decoration: none;
      color: #bdd0e8;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.88rem;
      text-transform: none;
      letter-spacing: 0.15px;
      font-weight: 600;
    }

    .nav a:hover,
    .nav a.active {
      background: var(--brand-soft);
      color: #8be9fd;
    }

    .content-shell { padding: 1rem; }

    .article-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
    }

    .article-card h1 { margin-top: 0; font-size: 2.05rem; line-height: 1.2; color: #f3f7ff; }
    .article-card h2 { font-size: 1.65rem; margin-top: 1.55rem; color: #edf4ff; }
    .article-card h3 { font-size: 1.3rem; margin-top: 1.3rem; color: #edf4ff; }
    .article-card p, .article-card li { color: #d8e3f3; }

    .article-card code {
      background: #223043;
      border: 1px solid #3f526e;
      border-radius: 5px;
      padding: 0.08rem 0.3rem;
      color: #bff7ff;
      font-family: "IBM Plex Mono", "Consolas", monospace;
    }

    .article-card pre {
      overflow-x: auto;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--code-bg);
    }

    .article-card pre code {
      border: 0;
      background: transparent;
      color: #bde7ff;
      padding: 0;
    }

    .article-card blockquote {
      margin-left: 0;
      padding: 0.35rem 0 0.35rem 0.8rem;
      border-left: 4px solid var(--line-strong);
      color: var(--muted);
    }

    .post-meta { color: var(--muted); margin-bottom: 1rem; }

    @media (max-width: 860px) {
      .brand { font-size: 1.9rem; }
      .subtitle { font-size: 0.94rem; }
      .article-card h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-head">
      <h1 class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <div class="site-top">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Головна</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>Про блог</a>
      </nav>
    </div>
    {{ content }}
  </div>
</body>
</html>
