<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <style>
    :root {
      --bg-a: #142033;
      --bg-b: #1f2e46;
      --surface: #1f2c3f;
      --card: #2b3a50;
      --line: #40516a;
      --line-strong: #596d8b;
      --ink: #e9f2ff;
      --muted: #b7c7de;
      --brand: #22d3ee;
      --brand-2: #f59e0b;
      --brand-3: #a78bfa;
      --brand-soft: #16374a;
      --code-bg: #243246;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 18%, rgba(245, 158, 11, 0.15) 0, transparent 25%),
        radial-gradient(circle at 88% 8%, rgba(34, 211, 238, 0.18) 0, transparent 28%),
        radial-gradient(circle at 70% 75%, rgba(167, 139, 250, 0.14) 0, transparent 22%),
        linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .bg-stickers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .sticker {
      position: absolute;
      padding: 0.24rem 0.56rem;
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.2px;
      color: #cfe8ff;
      border: 1px solid rgba(151, 187, 224, 0.26);
      background: rgba(20, 38, 59, 0.34);
      backdrop-filter: blur(1px);
      opacity: 0.24;
      font-family: "IBM Plex Mono", "Consolas", monospace;
      white-space: nowrap;
      animation: floaty 24s ease-in-out infinite;
    }

    .sticker.s2 { animation-duration: 32s; }
    .sticker.s3 { animation-duration: 28s; }
    .sticker.s4 { animation-duration: 36s; }
    .sticker.s5 { animation-duration: 30s; }
    .sticker.s6 { animation-duration: 34s; }

    @keyframes floaty {
      0% { transform: translate3d(0, 0, 0) rotate(-2deg); }
      25% { transform: translate3d(10px, -8px, 0) rotate(1deg); }
      50% { transform: translate3d(-8px, 9px, 0) rotate(3deg); }
      75% { transform: translate3d(6px, -6px, 0) rotate(-1deg); }
      100% { transform: translate3d(0, 0, 0) rotate(-2deg); }
    }

    .site-shell {
      max-width: 1120px;
      margin: 1.2rem auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(8, 12, 20, 0.35);
      position: relative;
      z-index: 1;
    }

    .site-shell::before,
    .site-shell::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 20px;
      filter: blur(2px);
      pointer-events: none;
      opacity: 0.5;
    }

    .site-shell::before {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(167, 139, 250, 0.15));
      top: -38px;
      right: 32px;
      transform: rotate(12deg);
    }

    .site-shell::after {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(34, 211, 238, 0.1));
      bottom: -38px;
      left: 28px;
      transform: rotate(-16deg);
    }

    .site-head {
      background: #111a29;
      border-bottom: 1px solid var(--line);
      padding: 1.1rem 1.2rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .site-head::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(34, 211, 238, 0.08) 45%, transparent 100%);
      pointer-events: none;
    }

    .brand {
      margin: 0;
      font-size: 2.35rem;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.2px;
      position: relative;
      z-index: 1;
    }

    .brand a { text-decoration: none; color: #f8fbff; }

    .subtitle {
      margin: 0.45rem 0 0;
      color: #9fb4d1;
      font-size: 1rem;
      position: relative;
      z-index: 1;
    }

    .site-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: #182336;
      border-bottom: 2px solid var(--brand);
    }

    .nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav a {
      text-decoration: none;
      color: #c3d5ee;
      padding: 0.45rem 0.78rem;
      border-radius: 999px;
      font-size: 0.88rem;
      text-transform: none;
      letter-spacing: 0.15px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .nav a:hover,
    .nav a.active {
      background: var(--brand-soft);
      border-color: #2f556b;
      color: #8be9fd;
    }

    .content-shell { padding: 1rem; }

    .article-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .article-card h1 { margin-top: 0; font-size: 2.05rem; line-height: 1.2; color: #f3f7ff; }
    .article-card h2 { font-size: 1.65rem; margin-top: 1.55rem; color: #edf4ff; }
    .article-card h3 { font-size: 1.3rem; margin-top: 1.3rem; color: #edf4ff; }
    .article-card p, .article-card li { color: #d8e3f3; }

    .article-card code {
      background: #223043;
      border: 1px solid #3f526e;
      border-radius: 5px;
      padding: 0.08rem 0.3rem;
      color: #bff7ff;
      font-family: "IBM Plex Mono", "Consolas", monospace;
    }

    .article-card pre {
      overflow-x: auto;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--code-bg);
    }

    .article-card pre code {
      border: 0;
      background: transparent;
      color: #bde7ff;
      padding: 0;
    }

    .article-card blockquote {
      margin-left: 0;
      padding: 0.35rem 0 0.35rem 0.8rem;
      border-left: 4px solid var(--line-strong);
      color: var(--muted);
    }

    .post-meta { color: var(--muted); margin-bottom: 1rem; }

    @media (max-width: 860px) {
      .brand { font-size: 1.9rem; }
      .subtitle { font-size: 0.94rem; }
      .article-card h1 { font-size: 1.75rem; }
      .sticker { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-stickers" aria-hidden="true">
    <span class="sticker s1" style="top: 12%; left: 4%;">terraform plan</span>
    <span class="sticker s2" style="top: 24%; right: 6%;">k8s rollout</span>
    <span class="sticker s3" style="top: 44%; left: 8%;">prometheus alert</span>
    <span class="sticker s4" style="top: 62%; right: 9%;">helm upgrade</span>
    <span class="sticker s5" style="top: 78%; left: 5%;">ci pipeline</span>
    <span class="sticker s6" style="top: 86%; right: 11%;">linux ops</span>
    <span class="sticker s2" style="top: 34%; right: 18%;">pepe: deploy survived</span>
    <span class="sticker s4" style="top: 70%; left: 16%;">pepe: on-call mode</span>
  </div>
  <div class="site-shell">
    <header class="site-head">
      <h1 class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <div class="site-top">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Головна</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>Про блог</a>
      </nav>
    </div>
    {{ content }}
  </div>
</body>
</html>
