<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/journal.css" | relative_url }}">
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><div class="reading-progress-bar" id="reading-progress-bar"></div></div>
  <div class="site-shell">
    <header class="site-head">
      <div class="header-icons" aria-hidden="true">
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/amazonwebservices-plain-wordmark.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/ansible.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/terraform.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/kubernetes.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/helm.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/argo.svg' | relative_url }}" alt=""></span>
        <button class="header-icon header-badge" id="linux-easter-trigger" type="button" aria-label="Linux badge">
          <img src="{{ '/assets/stickers/tools/linux.svg' | relative_url }}" alt="">
        </button>
      </div>
      <div class="header-badge-beer" id="beer-easter-egg" aria-hidden="true">
        <img src="{{ '/assets/stickers/memes/beer.svg' | relative_url }}" alt="">
      </div>
      <a class="header-profile-link" href="https://www.linkedin.com/in/dmytro-prodan/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
        <svg class="header-profile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.95v5.66H9.33V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.31 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM7.09 20.45H3.53V9h3.56v11.45ZM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0Z"/>
        </svg>
        <span>LinkedIn</span>
      </a>
      <p class="masthead-kicker">Paparoot / Практичний DevOps-журнал</p>
      <h1 class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <div class="site-top">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Головна</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>Про блог</a>
      </nav>
      <div class="lang-switch">
        <a class="lang-chip active" href="{{ page.url | relative_url }}" lang="uk">UA</a>
        {% if page.url == '/about/' %}
          <a class="lang-chip" href="{{ '/en/about/' | relative_url }}" lang="en">EN</a>
        {% else %}
          <a class="lang-chip" href="{{ '/en/' | relative_url }}" lang="en">EN</a>
        {% endif %}
      </div>
    </div>
    {{ content }}
  </div>
  <button id="back-to-top" class="back-top" type="button" aria-label="Back to top">↑</button>
  <script>
    (function () {
      var trigger = document.getElementById("linux-easter-trigger");
      var beer = document.getElementById("beer-easter-egg");
      if (trigger && beer) {
        var clicks = 0;
        var resetTimer = null;
        trigger.addEventListener("click", function () {
          clicks += 1;
          if (resetTimer) clearTimeout(resetTimer);
          resetTimer = setTimeout(function () { clicks = 0; }, 1200);
          if (clicks >= 3) {
            beer.classList.add("show");
            clicks = 0;
            setTimeout(function () { beer.classList.remove("show"); }, 2200);
          }
        });
      }

      var progressBar = document.getElementById("reading-progress-bar");
      var backTop = document.getElementById("back-to-top");
      var article = document.querySelector(".article-card");
      function onScroll() {
        var y = window.scrollY || window.pageYOffset;
        if (backTop) {
          if (y > 420) backTop.classList.add("show");
          else backTop.classList.remove("show");
        }
        if (!progressBar) return;
        if (!article) { progressBar.style.width = "0%"; return; }
        var top = article.offsetTop;
        var height = article.offsetHeight;
        var viewport = window.innerHeight || document.documentElement.clientHeight;
        var max = Math.max(1, height - viewport * 0.5);
        var raw = ((y - top + viewport * 0.2) / max) * 100;
        var pct = Math.max(0, Math.min(100, raw));
        progressBar.style.width = pct.toFixed(1) + "%";
      }
      if (backTop) {
        backTop.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      onScroll();
    })();
  </script>
</body>
</html>
