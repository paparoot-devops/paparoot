<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <style>
    :root {
      --bg-a: #142033;
      --bg-b: #1f2e46;
      --surface: #1f2c3f;
      --card: #2b3a50;
      --line: #40516a;
      --line-strong: #596d8b;
      --ink: #e9f2ff;
      --muted: #b7c7de;
      --brand: #22d3ee;
      --brand-2: #f59e0b;
      --brand-3: #a78bfa;
      --brand-soft: #16374a;
      --code-bg: #243246;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 18%, rgba(245, 158, 11, 0.15) 0, transparent 25%),
        radial-gradient(circle at 88% 8%, rgba(34, 211, 238, 0.18) 0, transparent 28%),
        radial-gradient(circle at 70% 75%, rgba(167, 139, 250, 0.14) 0, transparent 22%),
        linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 30;
      background: rgba(12, 20, 33, 0.35);
    }

    .reading-progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--brand), var(--brand-2), var(--brand-3));
      transition: width 80ms linear;
    }


    .site-shell {
      max-width: 1320px;
      margin: 1.2rem auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(8, 12, 20, 0.35);
      position: relative;
      z-index: 1;
    }

    .site-shell::before,
    .site-shell::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 20px;
      filter: blur(2px);
      pointer-events: none;
      opacity: 0.5;
    }

    .site-shell::before {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(167, 139, 250, 0.15));
      top: -38px;
      right: 32px;
      transform: rotate(12deg);
    }

    .site-shell::after {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(34, 211, 238, 0.1));
      bottom: -38px;
      left: 28px;
      transform: rotate(-16deg);
    }

    .site-head {
      background: #111a29;
      border-bottom: 1px solid var(--line);
      padding: 1.1rem 1.2rem 1rem;
      padding-right: 360px;
      position: relative;
      overflow: hidden;
    }

    .header-icons {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-profile-link {
      position: absolute;
      top: 58px;
      right: 12px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: #bfd3ef;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: color 140ms ease, opacity 140ms ease;
    }

    .header-profile-link:hover,
    .header-profile-link:focus {
      color: #8be9fd;
      opacity: 1;
    }

    .header-profile-icon {
      width: 16px;
      height: 16px;
      display: block;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .header-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(151, 181, 217, 0.35);
      background: rgba(24, 35, 54, 0.75);
    }

    .header-badge {
      cursor: pointer;
      user-select: none;
      transition: transform 140ms ease, border-color 140ms ease;
    }

    .header-badge:hover {
      transform: translateY(-1px);
      border-color: rgba(139, 233, 253, 0.65);
    }

    .header-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      pointer-events: none;
      filter: brightness(0) invert(1);
    }

    .header-badge-beer {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 2;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(151, 181, 217, 0.35);
      background: rgba(24, 35, 54, 0.75);
      opacity: 0;
      transform: translateY(-6px) scale(0.92);
      transition: opacity 240ms ease, transform 240ms ease;
      pointer-events: none;
    }

    .header-badge-beer.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .header-badge-beer img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .site-head::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(34, 211, 238, 0.08) 45%, transparent 100%);
      pointer-events: none;
    }

    .brand {
      margin: 0;
      font-size: 2.35rem;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.2px;
      position: relative;
      z-index: 1;
    }

    .brand a { text-decoration: none; color: #f8fbff; }

    .subtitle {
      margin: 0.45rem 0 0;
      color: #9fb4d1;
      font-size: 1rem;
      position: relative;
      z-index: 1;
    }

    .site-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: #182336;
      border-bottom: 2px solid var(--brand);
    }

    .nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav a {
      text-decoration: none;
      color: #c3d5ee;
      padding: 0.45rem 0.78rem;
      border-radius: 999px;
      font-size: 0.88rem;
      text-transform: none;
      letter-spacing: 0.15px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .nav a:hover,
    .nav a.active {
      background: var(--brand-soft);
      border-color: #2f556b;
      color: #8be9fd;
    }

    .lang-switch {
      display: inline-flex;
      gap: 0.4rem;
      align-items: center;
      margin-left: auto;
    }

    .lang-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 30px;
      padding: 0 0.5rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #bfd3ef;
      border: 1px solid #3a4f6a;
      background: #1c2a3d;
    }

    .lang-chip.active {
      color: #8be9fd;
      border-color: #2f556b;
      background: var(--brand-soft);
    }

    .content-shell { padding: 1rem; }

    .article-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .article-card h1 { margin-top: 0; font-size: 2.05rem; line-height: 1.2; color: #f3f7ff; }
    .article-card h2 { font-size: 1.65rem; margin-top: 1.55rem; color: #edf4ff; }
    .article-card h3 { font-size: 1.3rem; margin-top: 1.3rem; color: #edf4ff; }
    .article-card p, .article-card li { color: #d8e3f3; }
    .article-card a {
      color: #8fc7e8;
      text-decoration-color: rgba(143, 199, 232, 0.55);
      text-underline-offset: 2px;
    }
    .article-card a:hover {
      color: #a9dcf7;
      text-decoration-color: rgba(169, 220, 247, 0.8);
    }

    .article-card code {
      background: #223043;
      border: 1px solid #3f526e;
      border-radius: 5px;
      padding: 0.08rem 0.3rem;
      color: #bff7ff;
      font-family: "IBM Plex Mono", "Consolas", monospace;
    }

    .article-card pre {
      overflow-x: auto;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--code-bg);
    }

    .article-card pre code {
      border: 0;
      background: transparent;
      color: #bde7ff;
      padding: 0;
    }

    .article-card blockquote {
      margin-left: 0;
      padding: 0.35rem 0 0.35rem 0.8rem;
      border-left: 4px solid var(--line-strong);
      color: var(--muted);
    }

    .post-meta { color: var(--muted); margin-bottom: 1rem; }

    .back-top {
      position: fixed;
      right: 20px;
      bottom: 22px;
      z-index: 25;
      width: 40px;
      height: 40px;
      border: 1px solid #3e5876;
      border-radius: 10px;
      background: rgba(17, 26, 41, 0.82);
      color: #9fe9f7;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .back-top.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 960px) {
      .site-top { flex-wrap: wrap; }
      .lang-switch { width: 100%; justify-content: flex-end; }
    }

    @media (max-width: 1120px) {
      .site-head { padding-right: 1.2rem; }
      .header-icons,
      .header-badge-beer,
      .header-profile-link { display: none; }
    }

    @media (max-width: 860px) {
      .brand { font-size: 1.9rem; }
      .subtitle { font-size: 0.94rem; }
      .article-card h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><div class="reading-progress-bar" id="reading-progress-bar"></div></div>
  <div class="site-shell">
    <header class="site-head">
      <div class="header-icons" aria-hidden="true">
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/amazonwebservices-plain-wordmark.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/ansible.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/terraform.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/kubernetes.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/helm.svg' | relative_url }}" alt=""></span>
        <span class="header-icon"><img src="{{ '/assets/stickers/tools/argo.svg' | relative_url }}" alt=""></span>
        <button class="header-icon header-badge" id="linux-easter-trigger" type="button" aria-label="Linux badge">
          <img src="{{ '/assets/stickers/tools/linux.svg' | relative_url }}" alt="">
        </button>
      </div>
      <div class="header-badge-beer" id="beer-easter-egg" aria-hidden="true">
        <img src="{{ '/assets/stickers/memes/beer.svg' | relative_url }}" alt="">
      </div>
      <a class="header-profile-link" href="https://www.linkedin.com/in/dmytro-prodan/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
        <svg class="header-profile-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.95v5.66H9.33V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.31 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM7.09 20.45H3.53V9h3.56v11.45ZM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0Z"/>
        </svg>
        <span>LinkedIn</span>
      </a>
      <h1 class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <div class="site-top">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Головна</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>Про блог</a>
      </nav>
      <div class="lang-switch">
        <a class="lang-chip active" href="{{ page.url | relative_url }}" lang="uk">UA</a>
        {% if page.url == '/about/' %}
          <a class="lang-chip" href="{{ '/en/about/' | relative_url }}" lang="en">EN</a>
        {% else %}
          <a class="lang-chip" href="{{ '/en/' | relative_url }}" lang="en">EN</a>
        {% endif %}
      </div>
    </div>
    {{ content }}
  </div>
  <button id="back-to-top" class="back-top" type="button" aria-label="Back to top">↑</button>
  <script>
    (function () {
      var trigger = document.getElementById("linux-easter-trigger");
      var beer = document.getElementById("beer-easter-egg");
      if (trigger && beer) {
        var clicks = 0;
        var resetTimer = null;
        trigger.addEventListener("click", function () {
          clicks += 1;
          if (resetTimer) clearTimeout(resetTimer);
          resetTimer = setTimeout(function () { clicks = 0; }, 1200);
          if (clicks >= 3) {
            beer.classList.add("show");
            clicks = 0;
            setTimeout(function () { beer.classList.remove("show"); }, 2200);
          }
        });
      }

      var progressBar = document.getElementById("reading-progress-bar");
      var backTop = document.getElementById("back-to-top");
      var article = document.querySelector(".article-card");
      function onScroll() {
        var y = window.scrollY || window.pageYOffset;
        if (backTop) {
          if (y > 420) backTop.classList.add("show");
          else backTop.classList.remove("show");
        }
        if (!progressBar) return;
        if (!article) { progressBar.style.width = "0%"; return; }
        var top = article.offsetTop;
        var height = article.offsetHeight;
        var viewport = window.innerHeight || document.documentElement.clientHeight;
        var max = Math.max(1, height - viewport * 0.5);
        var raw = ((y - top + viewport * 0.2) / max) * 100;
        var pct = Math.max(0, Math.min(100, raw));
        progressBar.style.width = pct.toFixed(1) + "%";
      }
      if (backTop) {
        backTop.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      onScroll();
    })();
  </script>
</body>
</html>
